<footer class="site-footer">
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-4">
                <h4>{{ site.uistring.title }}</h4>
                <p>{{ site.uistring.description }}</p>
            </div>
            {% for col in site.data.footer.columns %}
            <div class="col-sm-2">
                <h4>{{ col.title }}</h4>
                <ul class="list-unstyled">
                    {% for link in col.links %}
                    <li>
                        <a href="{% if link.external %}{{ link.url }}{% else %}{{ site.baseurl }}{{ link.url }}{% endif %}"
                           {% if link.external %}target="_blank"{% endif %}>
                            {{ link.title }}
                        </a>
                    </li>
                    {% endfor %}
                </ul>
            </div>
            {% endfor %}
        </div>
        <hr>
        <div class="row">
            <div class="col-sm-12">
                <p class="text-center">&copy; {{ site.uistring.copyright }}</p>
            </div>
        </div>
    </div>
</footer>
