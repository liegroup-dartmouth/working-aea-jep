<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.uistring.title }}</title>
  <meta name="description" content="{{ site.uistring.description }}">
  <link rel="icon" type="image/x-icon" href="{{ site.baseurl }}/{{ site.favicon }}">
  <link rel="alternate" type="application/json" href="{{ site.baseurl }}/papers/article-index.json" title="JEP article index" />
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/styles.css">
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      },
      startup: {
        pageReady() {
          // pageReady() fires after DOMContentLoaded, so #main-content exists.
          // Protect currency dollar signs ($followed by digit) from being treated
          // as math delimiters. Kramdown (GFM mode) strips the backslash from \$,
          // so we handle this in JS before MathJax scans for delimiters.
          const content = document.getElementById('main-content');
          if (content) {
            const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
            const textNodes = [];
            let node;
            while ((node = walker.nextNode()) !== null) {
              if (!node.parentElement.closest('script,style,code,pre,.tex2jax_ignore')) {
                textNodes.push(node);
              }
            }
            for (const textNode of textNodes) {
              const text = textNode.nodeValue;
              if (!/\$\d/.test(text)) continue;
              const fragment = document.createDocumentFragment();
              let last = 0;
              const re = /\$(\d[\d,.]*)/g;
              let m;
              while ((m = re.exec(text)) !== null) {
                if (m.index > last) {
                  fragment.appendChild(document.createTextNode(text.slice(last, m.index)));
                }
                const span = document.createElement('span');
                span.className = 'tex2jax_ignore';
                span.textContent = m[0];
                fragment.appendChild(span);
                last = m.index + m[0].length;
              }
              if (last < text.length) {
                fragment.appendChild(document.createTextNode(text.slice(last)));
              }
              textNode.parentNode.replaceChild(fragment, textNode);
            }
          }
          return MathJax.startup.defaultPageReady();
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  {% include topnav.html %}
  {% include sidebar.html %}
  <div class="main-content-wrapper" id="main-content">
    {% if site.breadcrumb_display %}
    {% include breadcrumb.html %}
    {% endif %}
    {% if page.title %}<h1 class="page-title">{{ page.title }}</h1>{% endif %}
    {{ content }}
  </div>
  {% include footer.html %}
  <script>var siteBaseurl = "{{ site.baseurl }}";</script>
  <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lunr.js/2.3.9/lunr.min.js"></script>
  <script src="{{ site.baseurl }}/assets/js/main.js"></script>
</body>
</html>
